<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>LifeOS</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px 100px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
    }

    .status {
      margin-top: 4px;
      font-size: 12px;
      color: #777;
    }

    .date {
      font-size: 12px;
      color: #777;
      white-space: nowrap;
    }

    .section {
      padding: 14px;
      margin-bottom: 14px;
      background: #fff;
      border-radius: 16px;
    }

    .section-title {
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 2px 0 0;
    }

    .item-title {
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.3;
    }

    .meta {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.4;
      color: #777;
    }

    .empty {
      padding: 8px 0;
      color: #777;
      font-size: 14px;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 10;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
      font-size: 30px;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      padding: 16px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.45);
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      margin: 30px auto;
      padding: 18px;
      background: #fff;
      border-radius: 16px;
    }

    .modal-card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 14px;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      margin-top: 6px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .buttons button {
      min-height: 44px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    @media (max-width: 420px) {
      .app {
        padding-right: 10px;
        padding-left: 10px;
      }

      .title {
        font-size: 24px;
      }

      .section {
        padding: 12px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="title">LifeOS</div>
      <div class="status" id="status"></div>
    </div>

    <div class="date" id="date"></div>
  </div>

  <div class="section">

    <div class="section-title">
      АКТИВНІ ЗАДАЧІ
      <span id="taskCount"></span>
    </div>

    <div id="taskList">
      <div class="empty">Завантаження...</div>
    </div>

  </div>

</div>

<button
  class="fab"
  type="button"
  aria-label="Додати задачу"
  onclick="openTaskModal()"
>
  +
</button>

<div class="modal" id="taskModal">

  <div class="modal-card">

    <h2>Нова задача</h2>

    <label>
      Назва

      <input
        type="text"
        id="taskTitle"
        autocomplete="off"
      >
    </label>

    <label>
      Сфера

      <select id="taskArea">
        <option value="Служба">Служба</option>
        <option value="Здоров’я">Здоров’я</option>
        <option value="Навчання">Навчання</option>
        <option value="Розвиток">Розвиток</option>
        <option value="Фінанси">Фінанси</option>
        <option value="Стосунки">Стосунки</option>
        <option value="Побут">Побут</option>
        <option value="Документи">Документи</option>
      </select>
    </label>

    <label>
      Пріоритет

      <select id="taskPriority">
        <option value="Низький">Низький</option>
        <option value="Середній" selected>Середній</option>
        <option value="Високий">Високий</option>
      </select>
    </label>

    <label>
      Дедлайн

      <input
        type="date"
        id="taskDeadline"
      >
    </label>

    <label>
      Опис

      <textarea id="taskDescription"></textarea>
    </label>

    <div class="buttons">

      <button
        type="button"
        id="saveButton"
        onclick="saveTask()"
      >
        Зберегти
      </button>

      <button
        type="button"
        onclick="closeTaskModal()"
      >
        Скасувати
      </button>

    </div>

  </div>

</div>

<script>
const STORAGE_KEY =
  'LIFE_OS_LOCAL_TASKS_V1';

const SYNC_URL =
  'https://script.google.com/macros/s/AKfycbwuAMLftcL9CBqAa2IvawaoW8k70bTq4e3Zfcq1ZphZ4dcHKQiDsnoB65CBNZ0tAA2k9w/exec';

let serverTasks = [];
let syncInProgress = false;
let serverLoadError = false;


function getLocalTasks() {
  try {
    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!raw) {
      return [];
    }

    const tasks =
      JSON.parse(raw);

    return Array.isArray(tasks)
      ? tasks
      : [];

  } catch (error) {
    console.error(error);
    return [];
  }
}


function saveLocalTasks(tasks) {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(tasks)
  );
}


function getPendingTasks() {
  return getLocalTasks().filter(
    task => !task.synced
  );
}


function getPendingCount() {
  return getPendingTasks().length;
}


function renderTasks() {
  const localTasks =
    getPendingTasks().map(
      task => ({
        ...task,
        source: 'local'
      })
    );

  const googleTasks =
    serverTasks.map(
      task => ({
        ...task,
        source: 'server'
      })
    );

  const tasks = [
    ...googleTasks,
    ...localTasks
  ];

  document
    .getElementById('taskCount')
    .textContent =
      `(${tasks.length})`;

  const container =
    document.getElementById(
      'taskList'
    );

  if (tasks.length === 0) {
    container.innerHTML =
      '<div class="empty">Активних задач немає.</div>';

    return;
  }

  container.innerHTML =
    tasks.map(task => {

      const isServerTask =
        task.source === 'server';

      const sourceText =
        isServerTask
          ? 'Google Sheets'
          : 'Очікує синхронізації';

      const metaParts = [];

      if (task.area) {
        metaParts.push(
          escapeHtml(task.area)
        );
      }

      if (task.status) {
        metaParts.push(
          escapeHtml(task.status)
        );
      }

      if (task.priority) {
        metaParts.push(
          escapeHtml(task.priority)
        );
      }

      if (task.deadline) {
        metaParts.push(
          escapeHtml(task.deadline)
        );
      }

      metaParts.push(sourceText);

      return `
        <div class="item">

          <input
            type="checkbox"
            ${isServerTask ? 'disabled' : ''}
            onchange="toggleLocalTask('${escapeJs(task.id)}')"
          >

          <div>

            <div class="item-title">
              ${escapeHtml(task.title)}
            </div>

            <div class="meta">
              ${metaParts.join(' • ')}
            </div>

          </div>

        </div>
      `;
    })
    .join('');
}


async function loadServerTasks() {
  if (!navigator.onLine) {
    updateStatus();
    renderTasks();
    return;
  }

  try {
    const response =
      await fetch(
        SYNC_URL +
        '?api=tasks&t=' +
        Date.now(),
        {
          method: 'GET',
          cache: 'no-store'
        }
      );

    if (!response.ok) {
      throw new Error(
        'HTTP ' + response.status
      );
    }

    const data =
      await response.json();

    if (
      !data ||
      data.success !== true ||
      !Array.isArray(data.tasks)
    ) {
      throw new Error(
        'API повернуло неправильні дані.'
      );
    }

    serverTasks = data.tasks;
    serverLoadError = false;

    /*
     * Після успішного завантаження
     * прибираємо локальні записи,
     * які вже були відправлені.
     */
    saveLocalTasks(
      getLocalTasks().filter(
        task => !task.synced
      )
    );

  } catch (error) {
    console.error(error);
    serverLoadError = true;
  }

  renderTasks();
  updateStatus();
}


function openTaskModal() {
  document
    .getElementById('taskModal')
    .style.display = 'block';

  setTimeout(() => {
    document
      .getElementById('taskTitle')
      .focus();
  }, 50);
}


function closeTaskModal() {
  document
    .getElementById('taskModal')
    .style.display = 'none';
}


function clearTaskForm() {
  document
    .getElementById('taskTitle')
    .value = '';

  document
    .getElementById('taskPriority')
    .value = 'Середній';

  document
    .getElementById('taskDeadline')
    .value = '';

  document
    .getElementById('taskDescription')
    .value = '';
}


function saveTask() {
  const saveButton =
    document.getElementById(
      'saveButton'
    );

  const title =
    document
      .getElementById('taskTitle')
      .value
      .trim();

  if (!title) {
    alert('Вкажи назву задачі.');
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent =
    'Збереження…';

  try {
    const tasks =
      getLocalTasks();

    tasks.push({
      id:
        'LOCAL-' +
        Date.now() +
        '-' +
        Math.random()
          .toString(36)
          .slice(2),

      title: title,

      area:
        document
          .getElementById('taskArea')
          .value,

      priority:
        document
          .getElementById('taskPriority')
          .value,

      deadline:
        document
          .getElementById('taskDeadline')
          .value,

      description:
        document
          .getElementById('taskDescription')
          .value
          .trim(),

      createdAt:
        new Date().toISOString(),

      synced: false
    });

    saveLocalTasks(tasks);

    clearTaskForm();
    closeTaskModal();

    renderTasks();
    updateStatus();

    syncLocalTasks();

  } catch (error) {
    console.error(error);

    alert(
      'Не вдалося зберегти задачу.'
    );

  } finally {
    saveButton.disabled = false;
    saveButton.textContent =
      'Зберегти';
  }
}


function toggleLocalTask(id) {
  const tasks =
    getLocalTasks();

  const task =
    tasks.find(
      item => item.id === id
    );

  if (!task || task.synced) {
    return;
  }

  task.done = !task.done;

  saveLocalTasks(tasks);
  renderTasks();
}


async function syncLocalTasks() {
  if (
    !navigator.onLine ||
    syncInProgress
  ) {
    updateStatus();
    return;
  }

  const tasks =
    getLocalTasks();

  const pending =
    tasks.filter(
      task => !task.synced
    );

  if (pending.length === 0) {
    updateStatus();
    await loadServerTasks();
    return;
  }

  syncInProgress = true;
  updateStatus();

  try {
    for (const task of pending) {
      try {
        await fetch(
          SYNC_URL,
          {
            method: 'POST',
            mode: 'no-cors',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body: JSON.stringify({
              action: 'syncTask',

              clientRequestId:
                task.id,

              title:
                task.title,

              area:
                task.area,

              priority:
                task.priority,

              deadline:
                task.deadline || '',

              description:
                task.description || ''
            })
          }
        );

        task.synced = true;
        saveLocalTasks(tasks);

      } catch (error) {
        console.error(error);
        break;
      }
    }

  } finally {
    syncInProgress = false;

    renderTasks();
    updateStatus();

    await loadServerTasks();
  }
}


function updateStatus() {
  const status =
    document.getElementById(
      'status'
    );

  const pending =
    getPendingCount();

  if (!navigator.onLine) {
    status.textContent =
      pending > 0
        ? `Офлайн • ${pending} в черзі`
        : 'Офлайн';

    return;
  }

  if (syncInProgress) {
    status.textContent =
      pending > 0
        ? `Онлайн • синхронізація ${pending}`
        : 'Онлайн • синхронізація';

    return;
  }

  if (serverLoadError) {
    status.textContent =
      pending > 0
        ? `Онлайн • ${pending} в черзі • Google недоступний`
        : 'Онлайн • Google недоступний';

    return;
  }

  status.textContent =
    pending > 0
      ? `Онлайн • ${pending} очікує`
      : 'Онлайн ✓';
}


function escapeHtml(value) {
  return String(
    value == null
      ? ''
      : value
  )
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function escapeJs(value) {
  return String(
    value == null
      ? ''
      : value
  )
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n');
}


document
  .getElementById('date')
  .textContent =
    new Date()
      .toLocaleDateString(
        'uk-UA'
      );


document
  .getElementById('taskModal')
  .addEventListener(
    'click',
    event => {
      if (
        event.target.id ===
        'taskModal'
      ) {
        closeTaskModal();
      }
    }
  );


window.addEventListener(
  'offline',
  () => {
    updateStatus();
    renderTasks();
  }
);


window.addEventListener(
  'online',
  () => {
    updateStatus();
    syncLocalTasks();
  }
);


if ('serviceWorker' in navigator) {
  navigator.serviceWorker
    .register('./sw.js')
    .catch(console.error);
}


updateStatus();
renderTasks();
syncLocalTasks();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>LifeOS</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px 110px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
    }

    .status {
      margin-top: 4px;
      font-size: 12px;
      color: #777;
    }

    .date {
      font-size: 12px;
      color: #777;
      white-space: nowrap;
    }

    .section {
      padding: 14px;
      margin-bottom: 14px;
      background: #fff;
      border-radius: 16px;
    }

    .section-title {
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 2px 0 0;
    }

    .item-title {
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.3;
    }

    .meta {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.4;
      color: #777;
    }

    .empty {
      padding: 8px 0;
      color: #777;
      font-size: 14px;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 82px;
      z-index: 10;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
      font-size: 30px;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      padding: 16px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.45);
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      margin: 30px auto;
      padding: 18px;
      background: #fff;
      border-radius: 16px;
    }

    .modal-card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 14px;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      margin-top: 6px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .buttons button {
      min-height: 44px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .program-name {
      font-size: 16px;
      font-weight: 700;
    }

    .program-text {
      margin-top: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.5;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 15;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 720px;
      min-height: 66px;
      padding-bottom: env(safe-area-inset-bottom);
      border-top: 1px solid #ddd;
      background: #fff;
    }

    .nav-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #777;
      cursor: pointer;
    }

    .nav-button.active {
      color: #111;
      font-weight: 700;
    }

    .nav-icon {
      font-size: 20px;
      line-height: 1;
    }

    .nav-label {
      font-size: 11px;
    }

    @media (max-width: 420px) {
      .app {
        padding-right: 10px;
        padding-left: 10px;
      }

      .title {
        font-size: 24px;
      }

      .section {
        padding: 12px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="title">LifeOS</div>
      <div class="status" id="status"></div>
    </div>

    <div class="date" id="date"></div>
  </div>

  <div class="screen active" id="screenToday">
    <div id="todayContent">
      <div class="section">
        <div class="empty">Завантаження...</div>
      </div>
    </div>
  </div>

  <div class="screen" id="screenTasks">
    <div class="section">
      <div class="section-title">
        АКТИВНІ ЗАДАЧІ
        <span id="taskCount"></span>
      </div>

      <div id="taskList">
        <div class="empty">Завантаження...</div>
      </div>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <button
    class="nav-button active"
    type="button"
    data-screen="Today"
    onclick="openScreen('Today', this)"
  >
    <span class="nav-icon">⌂</span>
    <span class="nav-label">Сьогодні</span>
  </button>

  <button
    class="nav-button"
    type="button"
    data-screen="Tasks"
    onclick="openScreen('Tasks', this)"
  >
    <span class="nav-icon">✓</span>
    <span class="nav-label">Задачі</span>
  </button>
</nav>

<button
  class="fab"
  type="button"
  aria-label="Додати задачу"
  onclick="openTaskModal()"
>
  +
</button>

<div class="modal" id="taskModal">

  <div class="modal-card">

    <h2>Нова задача</h2>

    <label>
      Назва

      <input
        type="text"
        id="taskTitle"
        autocomplete="off"
      >
    </label>

    <label>
      Сфера

      <select id="taskArea">
        <option value="Служба">Служба</option>
        <option value="Здоров’я">Здоров’я</option>
        <option value="Навчання">Навчання</option>
        <option value="Розвиток">Розвиток</option>
        <option value="Фінанси">Фінанси</option>
        <option value="Стосунки">Стосунки</option>
        <option value="Побут">Побут</option>
        <option value="Документи">Документи</option>
      </select>
    </label>

    <label>
      Пріоритет

      <select id="taskPriority">
        <option value="Низький">Низький</option>
        <option value="Середній" selected>Середній</option>
        <option value="Високий">Високий</option>
      </select>
    </label>

    <label>
      Дедлайн

      <input
        type="date"
        id="taskDeadline"
      >
    </label>

    <label>
      Опис

      <textarea id="taskDescription"></textarea>
    </label>

    <div class="buttons">

      <button
        type="button"
        id="saveButton"
        onclick="saveTask()"
      >
        Зберегти
      </button>

      <button
        type="button"
        onclick="closeTaskModal()"
      >
        Скасувати
      </button>

    </div>

  </div>

</div>

<script>
const STORAGE_KEY =
  'LIFE_OS_LOCAL_TASKS_V1';

const SYNC_URL =
  'https://script.google.com/macros/s/AKfycbz_J1N7kIJyvjUg0FajYVsxolMqnuhJoSa3snI4IeqrYiDuEZ564Xs0z0-m_M_zrLZGMQ/exec';

let serverTasks = [];
let syncInProgress = false;
let serverLoadError = false;
let todayData = null;
let activeScreen = 'Today';


function openScreen(screenName, button) {
  document
    .querySelectorAll('.screen')
    .forEach(screen => {
      screen.classList.remove('active');
    });

  document
    .querySelectorAll('.nav-button')
    .forEach(item => {
      item.classList.remove('active');
    });

  const screen = document.getElementById(
    'screen' + screenName
  );

  if (!screen) {
    return;
  }

  screen.classList.add('active');

  if (button) {
    button.classList.add('active');
  }
    

  activeScreen = screenName;

  if (screenName === 'Today') {
    loadTodayData();
  } else {
    loadServerTasks();
  }
}


function loadTodayData() {
  return new Promise(resolve => {
    if (!navigator.onLine) {
      renderToday();
      resolve();
      return;
    }

    const callbackName =
      'lifeOsTodayCallback_' +
      Date.now() +
      '_' +
      Math.random().toString(36).slice(2);

    const script =
      document.createElement('script');

    let timeoutId;
    let finished = false;

    function cleanup() {
      if (timeoutId) {
        clearTimeout(timeoutId);
      }

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    function finish() {
      if (finished) {
        return;
      }

      finished = true;
      cleanup();
      renderToday();
      updateStatus();
      resolve();
    }

    window[callbackName] = data => {
      if (
        data &&
        data.success === true &&
        Array.isArray(data.tasks) &&
        Array.isArray(data.regulars)
      ) {
        todayData = data;
        serverLoadError = false;

        if (data.date) {
          document.getElementById('date')
            .textContent = data.date;
        }
      } else {
        serverLoadError = true;
      }

      finish();
    };

    script.onerror = () => {
      serverLoadError = true;
      finish();
    };

    script.src =
      SYNC_URL +
      '?api=today' +
      '&callback=' +
      callbackName +
      '&t=' +
      Date.now();

    document.body.appendChild(script);

    timeoutId = setTimeout(
      () => {
        serverLoadError = true;
        finish();
      },
      15000
    );
  });
}


function renderToday() {
  const container =
    document.getElementById('todayContent');

  if (!todayData) {
    container.innerHTML = `
      <div class="section">
        <div class="empty">
          ${navigator.onLine
            ? 'Не вдалося завантажити дані дня.'
            : 'Дані дня недоступні офлайн.'}
        </div>
      </div>
    `;
    return;
  }

  const tasks = todayData.tasks || [];
  const regulars = todayData.regulars || [];
  const program = todayData.program || {
    shown: false
  };

  let html = `
    <div class="section">
      <div class="section-title">
        ЗАДАЧІ ${tasks.length} / 15
      </div>
  `;

  if (tasks.length === 0) {
    html += '<div class="empty">Задач на сьогодні немає.</div>';
  }

  tasks.forEach(task => {
    html += `
      <div class="item">
        <input
          type="checkbox"
          onchange="completeServerTask(
            '${escapeJs(task.id)}',
            this
          )"
        >

        <div>
          <div class="item-title">
            ${escapeHtml(task.title)}
          </div>
          <div class="meta">
            ${escapeHtml(task.priority || '')}
            ${task.deadline
              ? ' • ' + escapeHtml(task.deadline)
              : ''}
          </div>
        </div>
      </div>
    `;
  });

  html += `
    </div>
    <div class="section">
      <div class="section-title">
        РЕГУЛЯРНІ ${regulars.length}
      </div>
  `;

  if (regulars.length === 0) {
    html += '<div class="empty">Регулярних дій немає.</div>';
  }

  regulars.forEach(regular => {
    html += `
      <div class="item">
        <input
          type="checkbox"
          ${regular.done ? 'checked disabled' : ''}
          onchange="completeRegularFromPwa(
            '${escapeJs(regular.id)}',
            this
          )"
        >

        <div>
          <div class="item-title">
            ${escapeHtml(regular.title)}
          </div>
          <div class="meta">
            ${escapeHtml(regular.time || '')}
          </div>
        </div>
      </div>
    `;
  });

  html += `
    </div>
    <div class="section">
      <div class="section-title">ПРОГРАМА</div>
  `;

  if (program.shown) {
    html += `
      <div class="program-name">
        ${escapeHtml(program.name || '')}
      </div>
      <div class="meta">
        День ${escapeHtml(program.day)} /
        ${escapeHtml(program.totalDays)} •
        ${escapeHtml(program.type || '')}
      </div>
      <div class="program-text">
        ${escapeHtml(program.workout || '')}
      </div>
    `;
  } else {
    html += '<div class="empty">Активної програми на сьогодні немає.</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}


function getLocalTasks() {
  try {
    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!raw) {
      return [];
    }

    const tasks =
      JSON.parse(raw);

    return Array.isArray(tasks)
      ? tasks
      : [];

  } catch (error) {
    console.error(error);
    return [];
  }
}


function saveLocalTasks(tasks) {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(tasks)
  );
}


function getPendingTasks() {
  return getLocalTasks().filter(
    task => !task.synced
  );
}


function getPendingCount() {
  return getPendingTasks().length;
}


function renderTasks() {
  const localTasks =
    getPendingTasks().map(
      task => ({
        ...task,
        source: 'local'
      })
    );

  const googleTasks =
    serverTasks.map(
      task => ({
        ...task,
        source: 'server'
      })
    );

  const tasks = [
    ...googleTasks,
    ...localTasks
  ];

  document
    .getElementById('taskCount')
    .textContent =
      `(${tasks.length})`;

  const container =
    document.getElementById(
      'taskList'
    );

  if (tasks.length === 0) {
    container.innerHTML =
      '<div class="empty">Активних задач немає.</div>';

    return;
  }

  container.innerHTML =
    tasks.map(task => {

      const isServerTask =
        task.source === 'server';

      const sourceText =
        isServerTask
          ? 'Google Sheets'
          : 'Очікує синхронізації';

      const metaParts = [];

      if (task.area) {
        metaParts.push(
          escapeHtml(task.area)
        );
      }

      if (task.status) {
        metaParts.push(
          escapeHtml(task.status)
        );
      }

      if (task.priority) {
        metaParts.push(
          escapeHtml(task.priority)
        );
      }

      if (task.deadline) {
        metaParts.push(
          escapeHtml(task.deadline)
        );
      }

      metaParts.push(sourceText);

      return `
        <div class="item">

          <input
            type="checkbox"
            onchange="handleTaskCheckbox(
              '${escapeJs(task.id)}',
              '${task.source}',
              this
            )"
          >

          <div>

            <div class="item-title">
              ${escapeHtml(task.title)}
            </div>

            <div class="meta">
              ${metaParts.join(' • ')}
            </div>

          </div>

        </div>
      `;
    })
    .join('');
}


function loadServerTasks() {
  return new Promise(resolve => {
    if (!navigator.onLine) {
      updateStatus();
      renderTasks();
      resolve();
      return;
    }

    const callbackName =
      'lifeOsTasksCallback_' +
      Date.now();

    const script =
      document.createElement('script');

    let timeoutId;

    function cleanup() {
      if (timeoutId) {
        clearTimeout(timeoutId);
      }

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(
          script
        );
      }
    }

    function finishWithError(error) {
      console.error(error);

      serverLoadError = true;

      cleanup();
      renderTasks();
      updateStatus();
      resolve();
    }

    window[callbackName] = data => {
      if (
        !data ||
        data.success !== true ||
        !Array.isArray(data.tasks)
      ) {
        finishWithError(
          new Error(
            'API повернуло неправильні дані.'
          )
        );

        return;
      }

      serverTasks = data.tasks;
      serverLoadError = false;

      saveLocalTasks(
        getLocalTasks().filter(
          task => !task.synced
        )
      );

      cleanup();
            renderTasks();
      updateStatus();
      resolve();
    };

    script.onerror = () => {
      finishWithError(
        new Error(
          'Не вдалося завантажити задачі.'
        )
      );
    };

    script.src =
      SYNC_URL +
      '?api=tasks' +
      '&callback=' +
      callbackName +
      '&t=' +
      Date.now();

    document.body.appendChild(
      script
    );

    timeoutId = setTimeout(
      () => {
        finishWithError(
          new Error(
            'Перевищено час очікування API.'
          )
        );
      },
      15000
    );
  });
}


function openTaskModal() {
  document
    .getElementById('taskModal')
    .style.display = 'block';

  setTimeout(() => {
    document
      .getElementById('taskTitle')
      .focus();
  }, 50);
}


function closeTaskModal() {
  document
    .getElementById('taskModal')
    .style.display = 'none';
}


function clearTaskForm() {
  document
    .getElementById('taskTitle')
    .value = '';

  document
    .getElementById('taskPriority')
    .value = 'Середній';

  document
    .getElementById('taskDeadline')
    .value = '';

  document
    .getElementById('taskDescription')
    .value = '';
}


function saveTask() {
  const saveButton =
    document.getElementById(
      'saveButton'
    );

  const title =
    document
      .getElementById('taskTitle')
      .value
      .trim();

  if (!title) {
    alert('Вкажи назву задачі.');
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent =
    'Збереження…';

  try {
    const tasks =
      getLocalTasks();

    tasks.push({
      id:
        'LOCAL-' +
        Date.now() +
        '-' +
        Math.random()
          .toString(36)
          .slice(2),

      title: title,

      area:
        document
          .getElementById('taskArea')
          .value,

      priority:
        document
          .getElementById('taskPriority')
          .value,

      deadline:
        document
          .getElementById('taskDeadline')
          .value,

      description:
        document
          .getElementById('taskDescription')
          .value
          .trim(),

      createdAt:
        new Date().toISOString(),

      synced: false
    });

    saveLocalTasks(tasks);

    clearTaskForm();
    closeTaskModal();

    renderTasks();
    updateStatus();

    syncLocalTasks();

  } catch (error) {
    console.error(error);

    alert(
      'Не вдалося зберегти задачу.'
    );

  } finally {
    saveButton.disabled = false;
    saveButton.textContent =
      'Зберегти';
  }
}


function handleTaskCheckbox(
  id,
  source,
  checkbox
) {
  if (
    !checkbox ||
    !checkbox.checked
  ) {
    return;
  }

  if (source === 'server') {
    completeServerTask(
      id,
      checkbox
    );

    return;
  }

  toggleLocalTask(id);
}


function sendCompleteTaskToServer(id) {
  return new Promise(
    (resolve, reject) => {
      const callbackName =
        'lifeOsCompleteCallback_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);

      const script =
        document.createElement('script');

      let timeoutId;
      let finished = false;

      function cleanup() {
        if (timeoutId) {
          clearTimeout(timeoutId);
        }

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(
            script
          );
        }
      }

      function fail(error) {
        if (finished) {
          return;
        }

        finished = true;
        cleanup();
        reject(error);
      }

      window[callbackName] = result => {
        if (finished) {
          return;
        }

        if (
          !result ||
          result.success !== true
        ) {
          fail(
            new Error(
              result && result.error
                ? result.error
                : 'Google не підтвердив завершення задачі.'
            )
          );

          return;
        }

        finished = true;
        cleanup();
        resolve(result);
      };

      script.onerror = () => {
        fail(
          new Error(
            'Не вдалося завершити задачу.'
          )
        );
      };

      const parameters =
        new URLSearchParams({
          api: 'completeTask',
          callback: callbackName,
          id: id,
          t: String(Date.now())
        });

      script.src =
        SYNC_URL +
        '?' +
        parameters.toString();

      document.body.appendChild(
        script
      );

      timeoutId = setTimeout(
        () => {
          fail(
            new Error(
              'Google не відповів протягом 20 секунд.'
            )
          );
        },
        20000
      );
    }
  );
}


async function completeServerTask(
  id,
  checkbox
) {
  if (!navigator.onLine) {
    checkbox.checked = false;

    alert(
      'Для завершення задачі потрібен інтернет.'
    );

    return;
  }

  checkbox.disabled = true;

  try {
    await sendCompleteTaskToServer(
      id
    );

    serverTasks =
      serverTasks.filter(
        task => task.id !== id
      );

    renderTasks();

    await loadServerTasks();
    await loadTodayData();

  } catch (error) {
    console.error(error);

    checkbox.checked = false;
    checkbox.disabled = false;

    alert(
      'Не вдалося завершити задачу: ' +
      error.message
    );
  }
}


function sendCompleteRegularToServer(id) {
  const parameters =
    new URLSearchParams({
      api: 'completeRegular',
      id: id,
      t: String(Date.now())
    });

  return fetch(
    SYNC_URL +
    '?' +
    parameters.toString(),
    {
      method: 'GET',
      mode: 'no-cors',
      cache: 'no-store'
    }
  );
}


async function completeRegularFromPwa(
  id,
  checkbox
) {
  if (!navigator.onLine) {
    checkbox.checked = false;

    alert(
      'Для виконання регулярної дії потрібен інтернет.'
    );

    return;
  }

  checkbox.disabled = true;

  try {
    await sendCompleteRegularToServer(id);

  } catch (error) {
    console.log(error);
  }

  await new Promise(resolve => {
    setTimeout(resolve, 1000);
  });

  await loadTodayData();
}


function toggleLocalTask(id) {
  const tasks =
    getLocalTasks();

  const task =
    tasks.find(
      item => item.id === id
    );

  if (!task || task.synced) {
    return;
  }

  task.done = !task.done;

  saveLocalTasks(tasks);
  renderTasks();
}


function sendTaskToServer(task) {
  return new Promise(
    (resolve, reject) => {
      const callbackName =
        'lifeOsSyncCallback_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);

      const script =
        document.createElement('script');

      let timeoutId;
      let finished = false;

      function cleanup() {
        if (timeoutId) {
          clearTimeout(timeoutId);
        }

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(
            script
          );
        }
      }

      function fail(error) {
        if (finished) {
          return;
        }

        finished = true;
        cleanup();
        reject(error);
              }

      window[callbackName] = result => {
        if (finished) {
          return;
        }

        if (
          !result ||
          result.success !== true ||
          !result.id
        ) {
          fail(
            new Error(
              result && result.error
                ? result.error
                : 'Google не підтвердив створення задачі.'
            )
          );

          return;
        }

        finished = true;
        cleanup();
        resolve(result);
      };

      script.onerror = () => {
        fail(
          new Error(
            'Не вдалося відправити задачу.'
          )
        );
      };

      const parameters =
        new URLSearchParams({
          api: 'syncTask',

          callback:
            callbackName,

          clientRequestId:
            task.id,

          title:
            task.title || '',

          area:
            task.area || '',

          priority:
            task.priority || 'Середній',

          deadline:
            task.deadline || '',

          description:
            task.description || '',

          t:
            String(Date.now())
        });

      script.src =
        SYNC_URL +
        '?' +
        parameters.toString();

      document.body.appendChild(
        script
      );

      timeoutId = setTimeout(
        () => {
          fail(
            new Error(
              'Google не відповів протягом 20 секунд.'
            )
          );
        },
        20000
      );
    }
  );
}


async function syncLocalTasks() {
  if (
    !navigator.onLine ||
    syncInProgress
  ) {
    updateStatus();
    return;
  }

  const tasks =
    getLocalTasks();

  const pending =
    tasks.filter(
      task => !task.synced
    );

  if (pending.length === 0) {
    updateStatus();
    await loadServerTasks();
    await loadTodayData();
    return;
  }

  syncInProgress = true;
  updateStatus();

  let syncError = null;

  try {
    for (const task of pending) {
      try {
        const result =
          await sendTaskToServer(
            task
          );

        task.synced = true;
        task.serverId = result.id;

        saveLocalTasks(tasks);

      } catch (error) {
        console.error(error);
        syncError = error;
        break;
      }
    }

  } finally {
    syncInProgress = false;

    renderTasks();
    updateStatus();

    await loadServerTasks();
    await loadTodayData();

    if (syncError) {
      alert(
        'Задача залишилася в черзі: ' +
        syncError.message
      );
    }
  }
}


function updateStatus() {
  const status =
    document.getElementById(
      'status'
    );

  const pending =
    getPendingCount();

  if (!navigator.onLine) {
    status.textContent =
      pending > 0
        ? `Офлайн • ${pending} в черзі`
        : 'Офлайн';

    return;
  }

  if (syncInProgress) {
    status.textContent =
      pending > 0
        ? `Онлайн • синхронізація ${pending}`
        : 'Онлайн • синхронізація';

    return;
  }

  if (serverLoadError) {
    status.textContent =
      pending > 0
        ? `Онлайн • ${pending} в черзі • Google недоступний`
        : 'Онлайн • Google недоступний';

    return;
  }

  status.textContent =
    pending > 0
      ? `Онлайн • ${pending} очікує`
      : 'Онлайн ✓';
}


function escapeHtml(value) {
  return String(
    value == null
      ? ''
      : value
  )
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function escapeJs(value) {
  return String(
    value == null
      ? ''
      : value
  )
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n');
}


document
  .getElementById('date')
  .textContent =
    new Date()
      .toLocaleDateString(
        'uk-UA'
      );


document
  .getElementById('taskModal')
  .addEventListener(
    'click',
    event => {
      if (
        event.target.id ===
        'taskModal'
      ) {
        closeTaskModal();
      }
    }
  );


window.addEventListener(
  'offline',
  () => {
    updateStatus();
    renderTasks();
    renderToday();
  }
);


window.addEventListener(
  'online',
  () => {
    updateStatus();
    syncLocalTasks();
  }
);


if ('serviceWorker' in navigator) {
  navigator.serviceWorker
    .register('./sw.js')
    .catch(console.error);
}


updateStatus();
renderTasks();
renderToday();
syncLocalTasks();
</script>
